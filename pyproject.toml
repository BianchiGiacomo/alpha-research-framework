[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alpharesearch"
version = "0.2.0"
description = "Leakage-checked, multiple-testing-aware evaluation of ML alpha signals"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-learn>=1.0",
    "pyarrow>=10",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["alpharesearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
